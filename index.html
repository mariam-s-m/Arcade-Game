<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Crosser - Arcade Game</title>
    <link rel="stylesheet" href="css/css.css">
    <link rel="icon" href="images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <h1 class="game-title">Bug Crosser</h1>
            <p class="game-subtitle">Dodge the enemies. Reach the water.</p>
        </header>

        <!-- Character Selection Screen -->
        <div class="screen char-select-screen" id="char-select-screen">
            <h2 class="screen-heading">Choose Your Hero</h2>
            <div class="char-grid" id="char-grid">
                <button class="char-card selected" data-sprite="images/char-cat-girl.png" data-name="Cat Girl">
                    <div class="char-img-wrap">
                        <img src="images/char-cat-girl.png" alt="Cat Girl">
                    </div>
                    <span class="char-name">Cat Girl</span>
                </button>
                <button class="char-card" data-sprite="images/char-boy.png" data-name="Boy">
                    <div class="char-img-wrap">
                        <img src="images/char-boy.png" alt="Boy">
                    </div>
                    <span class="char-name">Boy</span>
                </button>
                <button class="char-card" data-sprite="images/char-pink-girl.png" data-name="Pink Girl">
                    <div class="char-img-wrap">
                        <img src="images/char-pink-girl.png" alt="Pink Girl">
                    </div>
                    <span class="char-name">Pink Girl</span>
                </button>
                <button class="char-card" data-sprite="images/char-horn-girl.png" data-name="Horn Girl">
                    <div class="char-img-wrap">
                        <img src="images/char-horn-girl.png" alt="Horn Girl">
                    </div>
                    <span class="char-name">Horn Girl</span>
                </button>
                <button class="char-card" data-sprite="images/char-princess-girl.png" data-name="Princess">
                    <div class="char-img-wrap">
                        <img src="images/char-princess-girl.png" alt="Princess">
                    </div>
                    <span class="char-name">Princess</span>
                </button>
            </div>
            <div class="select-hint">
                <div class="select-hint-row">
                    <kbd>&larr;</kbd><kbd>&rarr;</kbd>
                    <span class="controls-label">to browse</span>
                </div>
                <div class="select-hint-row">
                    <kbd class="key-wide">Enter</kbd>
                    <span class="controls-label">to play</span>
                </div>
            </div>
        </div>

        <!-- Game Screen (hidden initially) -->
        <div class="screen game-screen hidden" id="game-screen">
            <div class="game-container" id="game-container-box">
                <div class="stats-bar">
                    <div class="stat" id="stat-score">
                        <span class="stat-label">SCORE</span>
                        <span class="stat-value" id="score-display">0</span>
                    </div>
                    <div class="stat" id="stat-combo">
                        <span class="stat-label">COMBO</span>
                        <span class="stat-value" id="combo-display">-</span>
                    </div>
                    <div class="stat" id="stat-level">
                        <span class="stat-label">LEVEL</span>
                        <span class="stat-value" id="level-display">1</span>
                    </div>
                    <div class="stat" id="stat-best">
                        <span class="stat-label">BEST</span>
                        <span class="stat-value" id="best-display">0</span>
                    </div>
                    <div class="stat" id="stat-lives">
                        <span class="stat-label">LIVES</span>
                        <span class="stat-value" id="lives-display"></span>
                    </div>
                </div>
                <div class="canvas-wrapper" id="canvas-container">
                    <!-- Canvas is injected here by engine.js -->
                </div>
            </div>

            <footer class="game-controls">
                <div class="controls-hint">
                    <div class="key-group">
                        <kbd>&uarr;</kbd>
                        <div class="key-row">
                            <kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd>
                        </div>
                    </div>
                    <span class="controls-label">Move</span>
                </div>
                <div class="controls-hint">
                    <kbd class="key-wide">Enter</kbd>
                    <span class="controls-label">New hero</span>
                </div>
            </footer>
        </div>
    </div>

    <script src="js/resources.js"></script>
    <script src="js/js.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
